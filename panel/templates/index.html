<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Livexa Panel - Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-brand">🟢 <strong>LIVEXA</strong></div>
        <div class="nav-links">
            <a href="/" class="nav-link active">📊 Dashboard</a>
            <a href="/live-sessions" class="nav-link">🎥 Sessions</a>
            <a href="/media-control" class="nav-link">🎵 Media</a>
            <a href="/logout" class="nav-link" style="color:#ff4444">Logout</a>
        </div>
    </nav>
    <div class="container">
        <h1>System Dashboard</h1>
        <div class="stats-grid">
            <div class="stat-card">
                <div style="color:#aaa">CPU</div>
                <div class="stat-val" id="cpu">- %</div>
            </div>
            <div class="stat-card">
                <div style="color:#aaa">RAM</div>
                <div class="stat-val" id="ram">- %</div>
            </div>
            <div class="stat-card">
                <div style="color:#aaa">Active Lives</div>
                <div class="stat-val" id="active">-</div>
            </div>
        </div>
        <div style="margin-top:2rem">
            <button class="btn btn-primary" onclick="location.href='/live-sessions'">+ Start New Stream</button>
        </div>
    </div>
    <script>
        function updateStats() {
            fetch('/api/status').then(r => r.json()).then(res => {
                if (res.status === 'success') {
                    document.getElementById('cpu').innerText = res.data.cpu_percent + '%';
                    document.getElementById('ram').innerText = res.data.memory_percent + '%';
                    document.getElementById('active').innerText = res.data.active;
                }
            });
        }
        setInterval(updateStats, 5000);
        updateStats();
    </script>
</body>

</html>
